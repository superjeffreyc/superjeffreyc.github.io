<div class="w-full max-w-2xl border border-slate-200 rounded-2xl p-6 md:p-8 bg-white shadow-sm self-start mb-12">
    <form id="personalContactForm" class="flex flex-col gap-6">
        <div class="flex flex-col gap-2">
            <label for="full-name" class="text-sm font-semibold text-slate-700">Name</label>
            <input type="text" id="full-name" name="name" placeholder="John Doe" autocomplete="name" required class="w-full px-4 py-3 border border-slate-200 rounded-xl bg-slate-50 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
        </div>

        <div class="flex flex-col gap-2">
            <label for="email" class="text-sm font-semibold text-slate-700">Email</label>
            <input type="email" id="email" name="email" placeholder="john@example.com" autocomplete="email" required class="w-full px-4 py-3 border border-slate-200 rounded-xl bg-slate-50 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
        </div>

        <div class="flex flex-col gap-2">
            <label for="subject" class="text-sm font-semibold text-slate-700">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="Project Inquiry" autocomplete="off" required class="w-full px-4 py-3 border border-slate-200 rounded-xl bg-slate-50 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
        </div>

        <div class="flex flex-col gap-2">
            <label for="message" class="text-sm font-semibold text-slate-700">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="How can I help you?" required class="w-full px-4 py-3 border border-slate-200 rounded-xl bg-slate-50 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all resize-none"></textarea>
        </div>

        <div class="cf-turnstile self-start" data-sitekey="0x4AAAAAACJTEik3RwZJb28c"></div>

        <button type="submit" class="w-full py-4 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold transition-all duration-200 shadow-md cursor-pointer flex items-center justify-center" id="submitBtn">
            <span id="btnText">Send Message</span>
        </button>
    </form>

    <div id="status-message" class="mt-4 text-center text-sm font-semibold"></div>
</div>
